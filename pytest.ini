[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# datetime.utcnow() is deprecated in Python 3.12; all timestamp calls will be
# replaced by ClockProvider / FakeClock in Phase 5.
filterwarnings =
    ignore::DeprecationWarning:app.*
